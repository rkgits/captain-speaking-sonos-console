name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy-production:
    name: Deploy (Production)
    runs-on: self-hosted
    environment: production    # pauses here until manually approved on GitHub

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production
        run: bash scripts/deploy.sh production
